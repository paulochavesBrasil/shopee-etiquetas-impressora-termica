<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Etiquetas divididas - Shopee</title>
    <link rel="stylesheet" href="print.css" />
  </head>
  <body>
    <div id="toolbar" class="no-print">
      <div class="toolbar-left">
        <strong>Etiquetas divididas</strong>
        <span id="status">Processando o PDF...</span>
      </div>
      <div class="toolbar-right">
        <label class="size-control">
          Tamanho da etiqueta:
          <select id="page-size">
            <option value="100x150" selected>10 x 15 cm (térmica)</option>
            <option value="105x148">A6 (10,5 x 14,8 cm)</option>
            <option value="quadrant">Tamanho original do recorte</option>
          </select>
        </label>
        <button id="print-btn" type="button" disabled>Imprimir</button>
      </div>
    </div>

    <div id="pages"></div>

    <script src="lib/pdf.min.js"></script>
    <script src="splitter.js"></script>
    <script src="print.js"></script>
  </body>
</html>
